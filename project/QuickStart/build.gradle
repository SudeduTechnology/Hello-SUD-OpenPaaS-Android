plugins {
    id 'com.android.application'
}

def demoAdMobAppId = project.findProperty('SUDM_DEMO_ADMOB_APP_ID')
        ?: 'ca-app-pub-9122824708293916~5253131528'

android {
    compileSdk 36

    defaultConfig {
        applicationId "tech.sud.mgp.hello"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName project.hasProperty("APP_VERSION_NAME")
                ? project.property("APP_VERSION_NAME")
                : "1.0.0"
        manifestPlaceholders = [SUDM_DEMO_ADMOB_APP_ID: demoAdMobAppId]
    }

    signingConfigs {
        release {
            if (project.hasProperty("jksPropertyPath") && project.jksPropertyPath != "") {
                // release设置发布签名路径
                Properties properties = new Properties()
                properties.load(new FileInputStream(file(project.jksPropertyPath)))
                storeFile file(properties['STORE_FILE'])
                storePassword properties['STORE_PWD']
                keyAlias properties['KEY_ALIAS']
                keyPassword properties['KEY_PWD']
            } else {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
        debug {
            storeFile file(RELEASE_STORE_FILE)
            storePassword RELEASE_STORE_PASSWORD
            keyAlias RELEASE_KEY_ALIAS
            keyPassword RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        mock {
            initWith debug
            matchingFallbacks = ['debug']
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    flavorDimensions 'channel'
    productFlavors {
        official {
            String channel = "official"
            buildConfigField("String", "CHANNEL", "\"" + channel + "\"")
            manifestPlaceholders.put("mainAppName", "SdkSUDOP")
        }
    }
    namespace 'global.sud.gi.hello'
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {

    implementation project(':SUDGIWrapper')

    // --- region Demo使用
    // 屏幕适配：https://github.com/JessYanCoding/AndroidAutoSize
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'

    // 网络请求库
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.trello.rxlifecycle4:rxlifecycle:4.0.2'
    implementation 'com.trello.rxlifecycle4:rxlifecycle-components:4.0.2'

    // 沉浸式状态栏
    implementation 'com.geyifeng.immersionbar:immersionbar:3.2.2'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'

    api 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.7' // https://github.com/CymChad/BaseRecyclerViewAdapterHelper
    // --- endregion Demo使用

}
