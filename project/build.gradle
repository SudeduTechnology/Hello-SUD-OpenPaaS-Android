// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 至少需要AndroidStudio版本是： Narwhal 功能更新 | 2025.1.2
        classpath 'com.android.tools.build:gradle:8.12.0'
    }
}

ext {
    compileSdk = 36
    minSdk = 26
    targetSdk = 36

    ndkVersion = "28.1.13356709"

    versionCode = "1"
    versionName = "1.8.6"
    buglyAppId = "f471ed313c"

    appcompatVersion = "1.4.2"
    materialVersion = "1.5.0"
    constraintlayoutVersion = "2.1.4"

}

allprojects {
    repositories {
        // region 增加阿里云云效 Maven ,加速构建
//        maven() {
//            url 'https://maven.aliyun.com/repository/public'
//        }
//        maven() {
//            url 'https://maven.aliyun.com/repository/google'
//        }
//        maven() {
//            url 'https://maven.aliyun.com/repository/gradle-plugin'
//        }
        // endregion 增加阿里云云效 Maven ,加速构建

        google()
        mavenCentral()
        maven() {
            url 'https://jitpack.io'
        }
        maven {
            url "https://central.sonatype.com/repository/maven-snapshots/"
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.name.startsWith("ijDownloadArtifact") }.each { t ->
        t.enabled = false
        println "⚠️ Disabled IntelliJ download task: ${t.name}"
    }
}